name: Validate Bandle closing

on:
  push:
    branches: ['feature/bandle-rumble-veigar-sprint']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
