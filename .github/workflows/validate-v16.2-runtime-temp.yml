name: Validate v16.2 runtime fixes

on:
  push:
    branches: ['feature/v16.2-assets-clean']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply runtime fixes
        run: node scripts/fix-v16.2-runtime-temp.mjs
      - run: npm install
      - run: npm run build
      - name: Commit validated fixes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/input/InputManager.ts src/scenes/WorldScene.ts src/scenes/PlayerWorldV13.ts src/scenes/BattleScene.ts src/scenes/BootScene.ts src/contenido/campeones/garen src/contenido/campeones/teemo src/contenido/campeones/poppy src/contenido/campeones/lulu src/contenido/campeones/tristana src/contenido/campeones/gnar
          git commit -m "fix(v16.2.1): restore runtime scale, bars, types and mobile controls"
          git push origin HEAD:feature/v16.2-assets-clean
