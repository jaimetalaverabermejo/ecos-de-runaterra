name: Validate v14.5.1 player scale

on:
  push:
    branches: ['feature/v14.5.1-player-scale']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v14.5.1-player-scale
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v14.5.1 patch
        run: node scripts/apply-v1451.mjs
      - run: npm install
      - run: npm run build
      - name: Commit validated patch if needed
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scenes/WorldScene.ts src/scenes/BootScene.ts package.json
          git commit -m "fix(v14.5.1): enlarge player overworld scale"
          git push origin HEAD:feature/v14.5.1-player-scale
