name: Validate v16.2 full champion migration

on:
  push:
    branches: ['feature/v16.2-assets-clean']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate and apply champion assets
        run: node scripts/migrate-v16-champions-temp.mjs
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit migration if build passed
        run: |
          if git diff --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/contenido/campeones
          git commit -m "feat(v16.2): integrate all rescaled champion assets"
          git push
