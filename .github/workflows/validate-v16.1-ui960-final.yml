name: Validate v16.1 UI960 final

on:
  push:
    branches: ['feature/v16.1-ui960-pack']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v16.1-ui960-pack
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
