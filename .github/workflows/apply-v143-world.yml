name: Validate v14.3 world narrative

on:
  push:
    branches: ['feature/v14.3-world-narrative']

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v14.3-world-narrative
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply v14.3 patch
        run: |
          node scripts/apply-v143-world.mjs
          node scripts/fix-v143-world-types.mjs

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Commit validated patch if needed
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scenes/WorldScene.ts src/scenes/BootScene.ts package.json
          git commit -m "feat(v14.3): connect world scene to narrative data"
          git push origin HEAD:feature/v14.3-world-narrative
