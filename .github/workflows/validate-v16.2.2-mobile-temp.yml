name: Validate v16.2.2 mobile coordinates

on:
  push:
    branches: ['feature/v16.2-assets-clean']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply mobile coordinate correction
        run: node scripts/fix-v16.2.2-mobile-coordinates-temp.mjs
      - run: npm install
      - run: npm run build
      - name: Commit validated correction
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/input/InputManager.ts src/scenes/WorldScene.ts src/scenes/BootScene.ts
          git commit -m "fix(v16.2.2): compensate mobile UI for legacy camera zoom"
          git push origin HEAD:feature/v16.2-assets-clean
