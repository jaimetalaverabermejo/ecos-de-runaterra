name: Validate v15 first playable echoes

on:
  push:
    branches: ['feature/v15-first-playable-echoes']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v15-first-playable-echoes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v15 runtime patches
        run: |
          node scripts/apply-v15-runtime.mjs
          node scripts/apply-v15-status-fix.mjs
          node scripts/apply-v15-battle-scene.mjs
      - run: npm install
      - run: npm run build
      - name: Commit validated patch if needed
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/types.ts src/systems/combat/BattleEngine.ts src/systems/combat/StatusEngine.ts src/scenes/BattleScene.ts
          git commit -m "feat(v15): integrate special mechanics into battle"
          git push origin HEAD:feature/v15-first-playable-echoes
