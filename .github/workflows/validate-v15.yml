name: Validate v15 first playable echoes

on:
  push:
    branches: ['feature/v15-first-playable-echoes']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v15-first-playable-echoes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply final v15 polish
        run: node scripts/apply-v15-final-polish.mjs
      - run: npm install
      - run: npm run build
      - name: Commit validated polish if needed
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scenes/BattleScene.ts
          git commit -m "fix(v15): make remaining battle paths form-aware"
          git push origin HEAD:feature/v15-first-playable-echoes
