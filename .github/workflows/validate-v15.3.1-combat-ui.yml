name: Validate v15.3.1 combat UI

on:
  push:
    branches: ['feature/v15.3.1-combat-ui']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v15.3.1-combat-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v15.3.1 UI
        run: node scripts/apply-v15.3.1-combat-ui.mjs
      - run: npm install
      - run: npm run build
      - name: Commit validated patch if needed
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(v15.3.1): refine combat skill UI"
          git push origin HEAD:feature/v15.3.1-combat-ui
