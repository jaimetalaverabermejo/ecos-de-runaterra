name: Validate v14.4 roster assets

on:
  push:
    branches: ['feature/v14.4-roster-assets']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v14.4-roster-assets
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v14.4 roster patch
        run: node scripts/apply-v144-roster.mjs
      - run: npm install
      - run: npm run build
      - name: Commit validated patch if needed
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/narrativeTypes.ts src/contenido/CatalogoMundo.ts src/scenes/WorldScene.ts src/data/DataRegistry.ts src/contenido/mundo/npcs/bandle-village.json src/scenes/BootScene.ts package.json
          git commit -m "feat(v14.4): activate roster assets as narrative NPCs"
          git push origin HEAD:feature/v14.4-roster-assets
