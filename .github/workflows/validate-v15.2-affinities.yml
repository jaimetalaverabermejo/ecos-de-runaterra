name: Validate v15.2 affinities

on:
  push:
    branches: ['feature/v15.2-affinities']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v15.2-affinities
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v15.2 affinity patch
        run: |
          node scripts/apply-v15.2-affinities.mjs
          node scripts/apply-v15.2-affinity-followup.mjs
      - run: npm install
      - run: npm run build
      - name: Commit validated patch if needed
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/types.ts src/contenido/CatalogoContenido.ts src/data/DataRegistry.ts src/systems/combat/BattleEngine.ts src/systems/combat/StatusEngine.ts src/scenes/BattleScene.ts src/scenes/TeamScene.ts src/scenes/ChampionDetailScene.ts src/scenes/PlayerScene.ts
          git commit -m "feat(v15.2): implement affinity system"
          git push origin HEAD:feature/v15.2-affinities
