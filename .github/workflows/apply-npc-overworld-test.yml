name: Apply NPC overworld test

on:
  push:
    branches: ['feature/npc-overworld-link']

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/npc-overworld-link
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply patch
        run: node scripts/apply-v142-npc-overworld.mjs

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Commit validated patch if needed
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scenes/WorldScene.ts src/scenes/TitleScene.ts src/data/world/regions/bandle-city/zones/bandle-village/interactions.ts src/data/quests/bandle-first-link.json package.json
          git commit -m "feat(v14.2): link NPC visuals to champion overworld assets"
          git push origin HEAD:feature/npc-overworld-link
