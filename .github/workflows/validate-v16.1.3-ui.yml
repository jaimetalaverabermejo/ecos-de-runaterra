name: Validate v16.1.3 UI embedded

on:
  push:
    branches:
      - feature/v16.1.3-ui-embedded

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
