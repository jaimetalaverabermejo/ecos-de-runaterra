name: Validate v16.4 UI960 full pass

on:
  push:
    branches: ['feature/v16.4-ui960-full-pass']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v16.4-ui960-full-pass
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply final runtime fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          world = Path('src/scenes/WorldScene.ts')
          text = world.read_text()
          old = """    this.scene.start('MenuScene');\n  }\n\n  private ensurePlayerAnimations"""
          new = """    this.scene.launch('MenuScene');\n    this.scene.pause();\n  }\n\n  private ensurePlayerAnimations"""
          if old in text:
              text = text.replace(old, new, 1)
              world.write_text(text)
          elif new not in text:
              raise SystemExit('WorldScene openMenu pattern not found')

          boot = Path('src/scenes/BootScene.ts')
          text = boot.read_text()
          old_version = "this.registry.set('app.version', '16.3.0 UI960 SHELL');"
          new_version = "this.registry.set('app.version', '16.4.0 UI960 FULL PASS');"
          if old_version in text:
              boot.write_text(text.replace(old_version, new_version, 1))
          elif new_version not in text:
              raise SystemExit('BootScene version pattern not found')

          detail = Path('src/scenes/ChampionDetailScene.ts')
          text = detail.read_text()
          text = text.replace("import type { ChampionInstance, StatBlock } from '../data/types';", "import type { ChampionInstance } from '../data/types';")
          pattern = r"\n  private shortBonuses\(bonuses: Partial<StatBlock>\): string \{\n    return Object\.entries\(bonuses\)\.map\(\(\[key, value\]\) => `\$\{DataRegistry\.stat\(key as keyof StatBlock\)\.short\}\+\$\{value\}`\)\.join\(' '\);\n  \}\n"
          cleaned, count = re.subn(pattern, '\n', text, count=1)
          if count:
              text = cleaned
          elif 'private shortBonuses' in text:
              raise SystemExit('ChampionDetail shortBonuses pattern changed')
          detail.write_text(text)
          PY
      - run: npm install
      - run: npm run build
      - name: Commit validated runtime changes
        run: |
          if git diff --quiet; then
            echo "No runtime changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scenes/WorldScene.ts src/scenes/BootScene.ts src/scenes/ChampionDetailScene.ts
          git commit -m "feat(v16.4): finalize native UI runtime"
          git push origin HEAD:feature/v16.4-ui960-full-pass
