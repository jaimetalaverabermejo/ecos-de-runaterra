name: Validate v16.4 UI960 full pass

on:
  push:
    branches: ['feature/v16.4-ui960-full-pass']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v16.4-ui960-full-pass
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply world overlay and version
        run: |
          python - <<'PY'
          from pathlib import Path

          world = Path('src/scenes/WorldScene.ts')
          text = world.read_text()
          old = """    this.scene.start('MenuScene');\n  }\n\n  private ensurePlayerAnimations"""
          new = """    this.scene.launch('MenuScene');\n    this.scene.pause();\n  }\n\n  private ensurePlayerAnimations"""
          if old not in text:
              raise SystemExit('WorldScene openMenu pattern not found')
          world.write_text(text.replace(old, new, 1))

          boot = Path('src/scenes/BootScene.ts')
          text = boot.read_text()
          old = "this.registry.set('app.version', '16.3.0 UI960 SHELL');"
          new = "this.registry.set('app.version', '16.4.0 UI960 FULL PASS');"
          if old not in text:
              raise SystemExit('BootScene version pattern not found')
          boot.write_text(text.replace(old, new, 1))
          PY
      - run: npm install
      - run: npm run build
      - name: Commit validated runtime changes
        run: |
          if git diff --quiet; then
            echo "No runtime changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scenes/WorldScene.ts src/scenes/BootScene.ts
          git commit -m "feat(v16.4): keep world visible behind menu overlay"
          git push origin HEAD:feature/v16.4-ui960-full-pass
