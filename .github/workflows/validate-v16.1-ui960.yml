name: Validate v16.1 UI960

on:
  push:
    branches: ['feature/v16.1-ui960-pack']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v16.1-ui960-pack
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: pip install pillow
      - name: Generate UI960 atlas
        run: python scripts/generate-ui960-atlas.py
      - name: Apply native combat UI patch
        run: node scripts/apply-v16.1-ui960.mjs
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src/scenes/BootScene.ts src/scenes/BattleScene.ts public/assets/ui/ui_960_v1/ui960-atlas.png public/assets/ui/ui_960_v1/ui960-atlas.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat(v16.1): integrate native 960 combat UI"
          git push origin HEAD:feature/v16.1-ui960-pack
