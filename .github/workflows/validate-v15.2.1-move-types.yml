name: Validate v15.2.1 move types

on:
  push:
    branches: ['feature/v15.2.1-move-types-v04']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v15.2.1-move-types-v04
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v0.4 move types
        run: node scripts/apply-v15.2.1-move-types-v04.mjs
      - run: npm install
      - run: npm run build
      - name: Commit validated data if needed
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/contenido/campeones/*/habilidades.json
          git commit -m "feat(v15.2.1): import v0.4 move types"
          git push origin HEAD:feature/v15.2.1-move-types-v04
