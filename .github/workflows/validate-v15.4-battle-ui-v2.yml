name: Validate v15.4 battle UI v2

on:
  push:
    branches: ['feature/v15.4-battle-ui-v2']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v15.4-battle-ui-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply final dialog adjustment
        run: node scripts/adjust-v15.4-dialog.mjs
      - run: npm install
      - run: npm run build
      - name: Commit validated adjustment if needed
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scenes/BattleScene.ts
          git commit -m "fix(v15.4): fit continue action in dialog panel"
          git push origin HEAD:feature/v15.4-battle-ui-v2
