name: Validate v16.2 clean migration

on:
  push:
    branches: ['feature/v16.2-assets-clean']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply player and first champion asset migration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def replace_or_verify(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old in text:
                  text = text.replace(old, new)
                  p.write_text(text)
              elif new not in text:
                  raise SystemExit(f'Expected migration pattern not found in {path}')

          replace_or_verify(
              'src/scenes/BootScene.ts',
              "import { LEGACY_ASSET_STANDARD } from '../config/AssetStandards';",
              "import { ASSET_STANDARD_960, LEGACY_ASSET_STANDARD } from '../config/AssetStandards';"
          )
          replace_or_verify(
              'src/scenes/BootScene.ts',
              "{ frameWidth: LEGACY_ASSET_STANDARD.overworld.frameWidth, frameHeight: LEGACY_ASSET_STANDARD.overworld.frameHeight }",
              "{ frameWidth: ASSET_STANDARD_960.overworld.frameWidth, frameHeight: ASSET_STANDARD_960.overworld.frameHeight }"
          )
          replace_or_verify(
              'src/scenes/BootScene.ts',
              "this.registry.set('app.version', '16.1.3 UI960 EMBED FIX');",
              "this.registry.set('app.version', '16.2 ASSET MIGRATION');"
          )

          replace_or_verify(
              'src/scenes/WorldScene.ts',
              "const PLAYER_TEXTURE_KEY = 'garen-overworld';",
              "const PLAYER_TEXTURE_KEY = 'player-overworld';"
          )
          replace_or_verify(
              'src/scenes/WorldScene.ts',
              "down: 'garen-walk-down', up: 'garen-walk-up', left: 'garen-walk-left', right: 'garen-walk-right'",
              "down: 'player-walk-down', up: 'player-walk-up', left: 'player-walk-left', right: 'player-walk-right'"
          )
          replace_or_verify(
              'src/scenes/WorldScene.ts',
              "const PLAYER_VISUAL_SCALE: Record<Facing, number> = { down: 1.88, right: 1.92, up: 2.02, left: 1.98 };",
              "const PLAYER_VISUAL_SCALE: Record<Facing, number> = { down: 0.94, right: 0.96, up: 1.01, left: 0.99 };"
          )

          for champion_id, scale in [('garen', 0.65), ('teemo', 0.51)]:
              path = Path(f'src/contenido/campeones/{champion_id}/personaje.json')
              data = json.loads(path.read_text())
              visual = data.setdefault('visual', {})
              visual['escalaOverworld'] = scale
              visual['frameOverworld'] = 96
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Commit migration if build passed
        run: |
          if git diff --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scenes/BootScene.ts src/scenes/WorldScene.ts src/contenido/campeones/garen/personaje.json src/contenido/campeones/teemo/personaje.json
          git commit -m "feat(v16.2): wire rescaled player Garen and Teemo assets"
          git push
