name: Validate v15.1 combat polish

on:
  push:
    branches: ['feature/v15.1-combat-polish']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v15.1-combat-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v15.1 runtime patch
        run: node scripts/apply-v15.1-combat-polish.mjs
      - run: npm install
      - run: npm run build
      - name: Commit validated patch if needed
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/contenido/CatalogoContenido.ts src/scenes/BattleScene.ts
          git commit -m "feat(v15.1): add combat visual polish and input guard"
          git push origin HEAD:feature/v15.1-combat-polish
