name: Materialize staged v16.2 components

on:
  push:
    branches: ['feature/v16.2-rescaled-assets']
    paths:
      - 'asset-staging/components/*.png.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Decode and verify staged components
        run: node scripts/materialize-staged-component.mjs
      - name: Commit verified PNGs
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/items/components asset-staging/components
          git commit -m "assets(v16.2): materialize verified 96px components"
          git push origin HEAD:feature/v16.2-rescaled-assets
