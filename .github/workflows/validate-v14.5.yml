name: Validate v14.5 living world

on:
  push:
    branches: ['feature/v14.5-living-world-scale']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v14.5-living-world-scale
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Finalize v14.5
        run: node scripts/finalize-v145.mjs
      - run: npm install
      - run: npm run build
      - name: Commit final cleanup if needed
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scenes/WorldScene.ts
          git commit -m "fix(v14.5): remove persistent interaction guidance"
          git push origin HEAD:feature/v14.5-living-world-scale
