name: Validate v14.5 living world

on:
  push:
    branches: ['feature/v14.5-living-world-scale']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v14.5-living-world-scale
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v14.5 patch
        run: node scripts/apply-v145b.mjs
      - run: npm install
      - run: npm run build
      - name: Commit validated patch if needed
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STRUCTURE.md package.json src/contenido/CatalogoContenido.ts src/data/DataRegistry.ts src/scenes/WorldScene.ts src/scenes/BootScene.ts src/contenido/mundo/npcs/bandle-village.json src/contenido/campeones/*/personaje.json src/contenido/campeones/gnar/formas/mega-gnar/forma.json
          git commit -m "feat(v14.5): add living NPC movement and visual scaling"
          git push origin HEAD:feature/v14.5-living-world-scale
