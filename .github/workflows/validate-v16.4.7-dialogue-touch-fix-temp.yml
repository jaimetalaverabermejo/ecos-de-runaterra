name: Validate v16.4.7 dialogue touch fix

on:
  push:
    branches: ['feature/v16.4.7-dialogue-touch-fix']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
