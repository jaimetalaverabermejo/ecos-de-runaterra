name: Validate v16 resolution foundation

on:
  push:
    branches: ['feature/v16-resolution-960-foundation']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v16-resolution-960-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply migration foundation
        run: node scripts/apply-v16-resolution-foundation.mjs
      - run: npm install
      - run: npm run build
      - name: Commit validated migration
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src/main.ts src/config src/contenido/CatalogoContenido.ts src/scenes
          git commit -m "feat(v16): migrate runtime canvas to 960x540"
          git push origin HEAD:feature/v16-resolution-960-foundation
