name: Validate pickup tile objects

on:
  push:
    branches: ['feature/tiled-pickup-tile-objects']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Validate pickup collection tileset
        run: |
          node <<'NODE'
          const fs = require('fs');
          const xml = fs.readFileSync('public/assets/world/regions/bandle-city/Tilesets/EdR_Pickups.tsx','utf8');
          const tiles=[...xml.matchAll(/<tile\s+[^>]*id="(\d+)"[^>]*>([\s\S]*?)<\/tile>/g)];
          if(tiles.length!==9) throw new Error('Expected 9 pickup tiles, found '+tiles.length);
          for(const m of tiles){
            const img=m[2].match(/source="([^"]+)"/)?.[1];
            if(!img) throw new Error('Pickup tile '+m[1]+' missing image');
          }
          console.log('Pickup tileset OK');
          NODE
