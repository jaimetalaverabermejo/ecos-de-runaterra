<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#071520" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ecos de Runaterra" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Ecos de Runaterra — Vertical Slice</title>
    <style>
      #rotate-device {
        display: none;
      }

      @media (orientation: portrait) and (any-pointer: coarse) {
        #rotate-device {
          position: fixed;
          inset: 0;
          z-index: 2147483647;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 12px;
          padding: 32px;
          box-sizing: border-box;
          background: #071520;
          color: #e9d59a;
          text-align: center;
          font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        #rotate-device strong {
          color: #7fdde3;
          font-size: clamp(24px, 7vw, 42px);
        }

        #rotate-device span {
          max-width: 34rem;
          font-size: clamp(15px, 4vw, 20px);
          line-height: 1.4;
        }
      }
    </style>
  </head>
  <body>
    <main id="game"></main>
    <aside id="rotate-device" aria-live="polite">
      <strong>Gira el dispositivo</strong>
      <span>Ecos de Runaterra está diseñado para jugar en horizontal.</span>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
