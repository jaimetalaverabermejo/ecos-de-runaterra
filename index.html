<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#071520" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ecos de Runaterra" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Ecos de Runaterra — Vertical Slice</title>

  </head>
  <body>
    <div id="console-shell">
      <div class="console-brand" aria-hidden="true">
        <span class="console-brand__rune">◇</span>
        <span>ECOS DE RUNATERRA</span>
      </div>

      <div class="console-controls console-controls--left" aria-label="Controles de movimiento">
        <div class="console-dpad">
          <img class="console-dpad__base" src="./assets/ui960_addon/touch/touch-dpad-base-192x192.png" alt="" draggable="false" />
          <button class="console-dpad__button console-dpad__button--up" data-ecos-direction="up" aria-label="Arriba">
            <img class="console-control-image console-control-image--normal" src="./assets/ui960_addon/touch/touch-dpad-arrow-44x44.png" alt="" draggable="false" />
            <img class="console-control-image console-control-image--pressed" src="./assets/ui960_addon/touch/touch-dpad-arrow-pressed-44x44.png" alt="" draggable="false" />
          </button>
          <button class="console-dpad__button console-dpad__button--left" data-ecos-direction="left" aria-label="Izquierda">
            <img class="console-control-image console-control-image--normal" src="./assets/ui960_addon/touch/touch-dpad-arrow-44x44.png" alt="" draggable="false" />
            <img class="console-control-image console-control-image--pressed" src="./assets/ui960_addon/touch/touch-dpad-arrow-pressed-44x44.png" alt="" draggable="false" />
          </button>
          <button class="console-dpad__button console-dpad__button--right" data-ecos-direction="right" aria-label="Derecha">
            <img class="console-control-image console-control-image--normal" src="./assets/ui960_addon/touch/touch-dpad-arrow-44x44.png" alt="" draggable="false" />
            <img class="console-control-image console-control-image--pressed" src="./assets/ui960_addon/touch/touch-dpad-arrow-pressed-44x44.png" alt="" draggable="false" />
          </button>
          <button class="console-dpad__button console-dpad__button--down" data-ecos-direction="down" aria-label="Abajo">
            <img class="console-control-image console-control-image--normal" src="./assets/ui960_addon/touch/touch-dpad-arrow-44x44.png" alt="" draggable="false" />
            <img class="console-control-image console-control-image--pressed" src="./assets/ui960_addon/touch/touch-dpad-arrow-pressed-44x44.png" alt="" draggable="false" />
          </button>
        </div>
      </div>

      <div id="console-screen">
        <main id="game"></main>
      </div>

      <div class="console-controls console-controls--right" aria-label="Botones de acción">
        <button class="console-action console-action--b" data-ecos-action="b" aria-label="Botón B">
          <img class="console-control-image console-control-image--normal" src="./assets/ui960_addon/touch/touch-button-round-116x116.png" alt="" draggable="false" />
          <img class="console-control-image console-control-image--pressed" src="./assets/ui960_addon/touch/touch-button-round-pressed-116x116.png" alt="" draggable="false" />
          <span class="console-action__label">B</span>
        </button>
        <button class="console-action console-action--a" data-ecos-action="a" aria-label="Botón A">
          <img class="console-control-image console-control-image--normal" src="./assets/ui960_addon/touch/touch-button-round-116x116.png" alt="" draggable="false" />
          <img class="console-control-image console-control-image--pressed" src="./assets/ui960_addon/touch/touch-button-round-pressed-116x116.png" alt="" draggable="false" />
          <span class="console-action__label">A</span>
        </button>
      </div>

      <div class="console-utility" aria-label="Controles de sistema">
        <button class="console-utility__button" data-ecos-action="menu" aria-label="Abrir menú">
          <img class="console-control-image console-control-image--normal" src="./assets/ui960_addon/touch/touch-button-menu-92x92.png" alt="" draggable="false" />
          <img class="console-control-image console-control-image--pressed" src="./assets/ui960_addon/touch/touch-button-menu-pressed-92x92.png" alt="" draggable="false" />
          <span class="console-utility__label">☰</span>
        </button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
